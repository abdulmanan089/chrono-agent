[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chrono-agent"
version = "0.4.0rc1"
description = "Local filesystem snapshots, savepoints, rollback, branches, advisory command scanning and a tamper-evident audit trail."
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
chrono = "chrono_agent.cli:main"

[tool.setuptools]
packages = ["chrono_agent"]
